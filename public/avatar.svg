<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 22 220 220" role="img" aria-label="Illustrated avatar of Rafa Al Razzak">
  <!-- Soft 3D "clay toy" cartoon: simple shapes, volume from light only.
       Key light from the upper left, ambient occlusion where forms meet. -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#EEF1FD"/>
      <stop offset="1" stop-color="#C9D2F4"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F0BC95"/>
      <stop offset="0.55" stop-color="#D99C74"/>
      <stop offset="1" stop-color="#B8784F"/>
    </radialGradient>
    <radialGradient id="ear" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#E6AA82"/>
      <stop offset="1" stop-color="#B57550"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9E6440"/>
      <stop offset="0.45" stop-color="#C68860"/>
      <stop offset="1" stop-color="#CF946B"/>
    </linearGradient>
    <radialGradient id="hair" cx="0.35" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#4A4955"/>
      <stop offset="0.45" stop-color="#22212A"/>
      <stop offset="1" stop-color="#0C0B10"/>
    </radialGradient>
    <linearGradient id="hairShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shirt" cx="0.35" cy="0.1" r="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#EEF1F8"/>
      <stop offset="1" stop-color="#D3DAEA"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#4A3A33"/>
      <stop offset="1" stop-color="#120D0B"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F08A76" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F08A76" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6B3F25" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6B3F25" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B66A8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5B66A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="240" height="260" fill="url(#bg)"/>

  <!-- soft contact shadow behind the shoulders -->
  <ellipse cx="120" cy="214" rx="96" ry="30" fill="url(#ground)"/>

  <!-- shirt -->
  <path d="M38 244c0-40 28-64 82-64s82 24 82 64z" fill="url(#shirt)"/>
  <path d="M60 210c10-12 24-20 40-24" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8" fill="none"/>

  <!-- neck with shadow cast by the chin -->
  <rect x="104" y="148" width="32" height="40" rx="14" fill="url(#neck)"/>

  <!-- collar -->
  <path d="M98 180l22 22-12 10-16-26z" fill="#FFFFFF"/>
  <path d="M142 180l-22 22 12 10 16-26z" fill="#F3F5FA"/>
  <path d="M98 180l22 22 22-22" fill="none" stroke="#CBD3E8" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- ears -->
  <circle cx="73" cy="118" r="13" fill="url(#ear)"/>
  <circle cx="167" cy="118" r="13" fill="url(#ear)"/>
  <circle cx="74" cy="119" r="5.5" fill="#A86B47" opacity="0.45"/>
  <circle cx="166" cy="119" r="5.5" fill="#A86B47" opacity="0.45"/>

  <!-- head -->
  <rect x="73" y="56" width="94" height="108" rx="47" fill="url(#skin)"/>

  <!-- hair: one bold, glossy shape -->
  <path d="M70 112c-6-44 16-68 52-70 32-2 52 16 50 52-2 10-4 17-6 21-2-16-8-29-16-35-14 8-38 10-60 2-8 8-13 18-20 30z" fill="url(#hair)"/>
  <ellipse cx="120" cy="80" rx="40" ry="10" fill="url(#ao)" opacity="0.6"/>
  <path d="M94 56c16-10 40-10 56 2" stroke="url(#hairShine)" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- eyes: glossy beads -->
  <circle cx="104" cy="120" r="6.5" fill="url(#eye)"/>
  <circle cx="136" cy="120" r="6.5" fill="url(#eye)"/>
  <circle cx="106.2" cy="117.6" r="2.1" fill="#FFFFFF"/>
  <circle cx="138.2" cy="117.6" r="2.1" fill="#FFFFFF"/>

  <!-- blush -->
  <circle cx="93" cy="137" r="10" fill="url(#blush)"/>
  <circle cx="147" cy="137" r="10" fill="url(#blush)"/>

  <!-- smile -->
  <path d="M110 142q10 8 20 0" fill="none" stroke="#3A2119" stroke-width="4.5" stroke-linecap="round"/>

</svg>
